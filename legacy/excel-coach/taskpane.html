<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excel Coach</title>
    <link rel="stylesheet" href="./taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main class="coach-main">
      <header class="coach-header">
        <div class="coach-brand">
          <svg class="coach-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="4" fill="#252526"/>
            <rect x="4" y="6" width="18" height="20" rx="1" fill="#1e1e1e" stroke="#0078d4" stroke-width="1"/>
            <line x1="4" y1="12" x2="22" y2="12" stroke="#3c3c3c" stroke-width="0.5"/>
            <line x1="4" y1="18" x2="22" y2="18" stroke="#3c3c3c" stroke-width="0.5"/>
            <line x1="11" y1="6" x2="11" y2="26" stroke="#3c3c3c" stroke-width="0.5"/>
            <rect x="16" y="13" width="12" height="8" rx="1" fill="#0078d4"/>
            <text x="22" y="19" font-family="Arial" font-size="5" font-weight="bold" fill="#fff" text-anchor="middle">KEY</text>
            <circle cx="26" cy="8" r="5" fill="#4ec9b0"/>
            <path d="M23.5 8 L25.5 10 L29 6" stroke="#1e1e1e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <div class="coach-titles">
            <h1>Excel Coach</h1>
            <p class="coach-subtitle">Keyboard Efficiency Trainer</p>
          </div>
        </div>
        <button id="resetDemo" class="reset-btn" aria-label="Reset progress">Reset</button>
      </header>

      <div id="flash" class="flash"></div>

      <p class="coach-hint">
        <strong>+</strong> = press together &nbsp;|&nbsp; <strong>,</strong> = sequential keys
      </p>

      <section id="skillsContainer" class="skills-list"></section>

      <footer class="coach-footer">
        Usage is tracked locally. No workbook data is stored or transmitted.
      </footer>
    </main>
  </body>
</html>
